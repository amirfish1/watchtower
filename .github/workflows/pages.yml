# Publishes ONLY site/ (the files listed in site/MANIFEST.txt) to GitHub Pages.
# docs/ holds internal design notes and is never uploaded.
name: Publish site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check site/ matches MANIFEST.txt
        run: |
          grep -v '^#' site/MANIFEST.txt | grep -v '^$' | sort > /tmp/listed
          ls -A site | grep -v '^MANIFEST.txt$' | sort > /tmp/actual
          diff /tmp/listed /tmp/actual
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
